<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Checker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mut:#6a7585;--line:#e3e7ee;--acc:#2f6fed;--accbg:#e8f0ff;--ok:#1f9d63;--okbg:#e4f6ec;--low:#c77700;--lowbg:#fff1d9;--out:#d23f3f;--outbg:#fde8e8;--bar:#9db8f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222c;--ink:#e8edf4;--mut:#93a0b3;--line:#2b3441;--acc:#6b9bff;--accbg:#22314d;--ok:#4fd195;--okbg:#17332a;--low:#f2b34c;--lowbg:#3a2e17;--out:#ff7b7b;--outbg:#3d2022;--bar:#3e5fa8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222c;--ink:#e8edf4;--mut:#93a0b3;--line:#2b3441;--acc:#6b9bff;--accbg:#22314d;--ok:#4fd195;--okbg:#17332a;--low:#f2b34c;--lowbg:#3a2e17;--out:#ff7b7b;--outbg:#3d2022;--bar:#3e5fa8;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpi span{color:var(--mut);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.search{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;color:var(--ink)}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#q{flex:1;min-width:200px;font-size:15px}
button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.seg{display:inline-flex;gap:0}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.hint{color:var(--mut);font-size:12px;margin-top:6px}code{background:var(--bg);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}.row input{width:110px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border-radius:999px;padding:3px 10px;font-size:12px}.chip small{opacity:.7;margin-left:4px}
.s-out{background:var(--outbg);color:var(--out)}.s-low{background:var(--lowbg);color:var(--low)}.s-ok{background:var(--okbg);color:var(--ok)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mut);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.g{cursor:pointer}tr.g:hover td{background:var(--bg)}tr.sub td{background:var(--bg);padding-left:28px;font-size:13px}
.cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}.track{flex:0 0 90px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.track i{display:block;height:100%;background:var(--bar)}
mark{background:#ffe58a;color:#1b2430;border-radius:2px}
.dup{font-size:11px;color:var(--low);margin-left:6px}.empty{padding:30px;text-align:center;color:var(--mut)}
@media(max-width:600px){.track{display:none}.wrap{padding:10px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>Stock Checker</h1><div class="sub">Unrestricted stock by material and batch</div></div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><span id="live" class="sub"></span><button id="refresh">↻ Refresh</button><button id="theme" title="Toggle theme">◐</button></div></div>
<div class="kpis" id="kpis"></div>

<div class="panel">
<div class="search">
<input type="text" id="q" placeholder="Search material or batch…  press / to focus" autocomplete="off">
<div class="seg"><button data-view="batch" class="on">Batches</button><button data-view="mat">Materials</button></div>
<button id="clear">Clear all</button>
</div>
<div class="hint">Ignores dashes and spaces (<code>pa66g30</code> finds PA66-G30). Combine terms: <code>bk -ads</code> excludes · <code>batch:9013</code> · <code>mat:vicnyl</code> · <code>qty:&gt;1k</code> · <code>qty:100-500</code></div>
<div class="chips" id="fams"></div>
<div class="row">
<div id="stat" class="chips" style="margin:0"></div>
<label>Min stock<input type="number" id="min" min="0" placeholder="0"></label>
<label>Max stock<input type="number" id="max" min="0" placeholder="any"></label>
<label>Low-stock at ≤<input type="number" id="low" min="1" value="100"></label>
<label>Unit<select id="unit"><option value="kg">kg</option><option value="t">tonnes</option></select></label>
</div>
</div>

<div class="bar"><div id="summary" class="sub"></div><button id="copy">Copy results</button></div>
<div class="tw"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
<div style="text-align:center;margin:12px"><button id="more" hidden>Show more</button></div>
</div>

function parse(q){
  const preds=[],hl=[];
  (q.match(/"[^"]+"|\S+/g)||[]).forEach(t=>{
    t=t.replace(/"/g,'');let m;
    if(m=t.match(/^(?:qty|q):(.+)$/i)){const v=m[1];let a,b;
      if(m=v.match(/^(>=|<=|>|<|=)(.+)$/)){const n=num(m[2]);if(!isNaN(n)){const o=m[1];preds.push(r=>o==='>'?r.q>n:o==='<'?r.q<n:o==='>='?r.q>=n:o==='<='?r.q<=n:r.q===n)}}
      else if(m=v.match(/^(.+?)-(.+)$/)){a=num(m[1]);b=num(m[2]);if(!isNaN(a)&&!isNaN(b))preds.push(r=>r.q>=a&&r.q<=b)}
      else{const n=num(v);if(!isNaN(n))preds.push(r=>r.q===n)}
    }else if(m=t.match(/^(?:batch|b):(.+)$/i)){const v=m[1].toLowerCase();preds.push(r=>r.b.includes(v));hl.push(m[1])}
    else if(m=t.match(/^(?:mat|m):(.+)$/i)){const v=norm(m[1]);preds.push(r=>norm(r.m).includes(v));hl.push(m[1])}
    else if(t[0]==='-'&&t.length>1){const v=norm(t.slice(1));preds.push(r=>!r.k.includes(v))}
    else{const v=norm(t);if(v){preds.push(r=>r.k.includes(v));hl.push(t)}}
  });
  return{preds,hl};
}

function fromTable(a){

    setMsg('Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setMsg('Could not reach the sheet · showing last saved data')}
}
try{const s=JSON.parse(localStorage.getItem('stock')||'null');if(s&&s.rows){load(s.rows);render();setMsg('Saved copy from '+new Date(s.t).toLocaleString())}}catch(_){}
$('refresh').onclick=refresh;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
setInterval(refresh,5*60*1000);
refresh();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
